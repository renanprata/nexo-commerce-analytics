services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: student
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nexo_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./sql/03_analytics.sql:/docker-entrypoint-initdb.d/03_analytics.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d nexo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  nexo_data:
